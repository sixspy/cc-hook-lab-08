<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>端点名册 · 投递台</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
<header class="顶栏">
    <div class="牌">投递台</div>
    <nav>
      <a href="/">投递台</a>
      <a href="/端点名册.html" class="亮">端点名册</a>
      <a href="/事件队列.html">事件队列</a>
      <a href="/投递流水.html">投递流水</a>
      <a href="/死信匣.html">死信匣</a>
      <a href="/签名规.html">签名规</a>
      <a href="/投递互证.html">投递互证</a>
      <a href="/事件详情.html">事件详情</a>
    </nav>
    <button class="按钮 次" type="button" onclick="fetch('/api/登出',{method:'POST'}).then(()=>location.href='/login')">退出</button>
  </header>
  <main class="主区">
    <header class="页头">
      <h1>端点名册</h1>
      <p>Webhook 投递控制台 · 应用开发全栈 · 非工单客服</p>
    </header>

<section class="卷">
  <p class="说明" id="队列态">端点名册与事件队列同源：装闸时一并核对各端点的待投/脱敏摘要。</p>
</section>
<section class="卷">
  <label>端点键</label><input id="端点键" placeholder="ep-new"/>
  <label>名称</label><input id="名称"/>
  <label>回调URL</label><input id="回调URL" placeholder="https://..."/>
  <label>密钥版本</label><input id="密钥版本" value="v1"/>
  <p class="消息" id="消息"></p>
  <button class="按钮" type="button" id="登记">登记端点</button>
</section>
<section class="卷"><div class="表绕"><table><thead><tr><th>端点键</th><th>名称</th><th>回调URL</th><th>密钥版本</th><th>启用</th><th>操作</th></tr></thead><tbody id="表"></tbody></table></div></section>

  </main>

<script>
async function 刷表() {
  const rows = await 投递台.getJSON('/api/端点');
  const tb = document.getElementById('表'); tb.innerHTML='';
  for (const r of rows) {
    const tr = 投递台.行('<td>'+投递台.安全文本(r.端点键)+'</td><td>'+投递台.安全文本(r.名称)+'</td><td>'+投递台.安全文本(r.回调URL)+'</td><td>'+投递台.安全文本(r.密钥版本)+'</td><td></td><td></td>');
    tr.children[4].appendChild(投递台.徽章(r.启用 ? '启用' : '停用'));
    const btn = document.createElement('button'); btn.className='按钮 次'; btn.type='button';
    btn.textContent = r.启用 ? '停用' : '启用';
    btn.onclick = async () => { await 投递台.postJSON('/api/端点/启用', {端点键:r.端点键, 启用: !r.启用}); await 刷表(); await 刷队列态(); };
    tr.children[5].appendChild(btn); tb.appendChild(tr);
  }
}
async function 刷队列态() {
  const evs = await 投递台.getJSON('/api/事件');
  const 待 = evs.filter(e => e.状态 === '待投' || e.状态 === '投递中');
  const 异常 = evs.filter(e => e.摘要脱敏态 !== '已脱敏');
  document.getElementById('队列态').textContent =
    `事件队列同源：待投/投递中 ${待.length} 条 · 摘要脱敏态非「已脱敏」 ${异常.length} 条` +
    (异常.length ? `（${异常.map(e => e.事件号).join(', ')}，见事件队列）` : ' · 现行摘要均为脱敏集');
}
document.getElementById('登记').onclick = async () => {
  try {
    await 投递台.postJSON('/api/端点', {
      端点键: document.getElementById('端点键').value,
      名称: document.getElementById('名称').value,
      回调URL: document.getElementById('回调URL').value,
      密钥版本: document.getElementById('密钥版本').value,
    });
    document.getElementById('消息').textContent = '已登记';
    await 刷表(); await 刷队列态();
  } catch (e) { document.getElementById('消息').textContent = e.message; }
};
刷表(); 刷队列态();
</script>

</body>
</html>

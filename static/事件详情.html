<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>事件详情 · 投递台</title>
  <link rel="stylesheet" href="/styles.css"/>
  <script src="/common.js"></script>
</head>
<body>
<header class="顶栏">
    <div class="牌">投递台</div>
    <nav>
      <a href="/">投递台</a>
      <a href="/端点名册.html">端点名册</a>
      <a href="/事件队列.html">事件队列</a>
      <a href="/投递流水.html">投递流水</a>
      <a href="/死信匣.html">死信匣</a>
      <a href="/签名规.html">签名规</a>
      <a href="/投递互证.html">投递互证</a>
      <a href="/事件详情.html" class="亮">事件详情</a>
    </nav>
    <button class="按钮 次" type="button" onclick="fetch('/api/登出',{method:'POST'}).then(()=>location.href='/login')">退出</button>
  </header>
  <main class="主区">
    <header class="页头">
      <h1>事件详情</h1>
      <p>Webhook 投递控制台 · 应用开发全栈 · 非工单客服</p>
    </header>

<section class="卷">
  <label>事件号</label><input id="事件号"/>
  <p class="消息" id="消息"></p>
  <button class="按钮" type="button" id="查">查询</button>
  <p class="说明" id="摘要态"></p>
  <pre id="出" class="说明"></pre>
</section>

  </main>

<script>
function 读态(d) {
  const 态 = d.摘要脱敏态 || '待补档';
  const 遮 = d.遮罩字段 || '—';
  const 账 = d.摘要对账 || {};
  return `摘要脱敏态：${态} · 字段遮罩：${遮} · 提示：${d.脱敏提示 || ''} · 对账：${账.结论 || '—'}（${账.说明 || ''}）`;
}
async function 查询(id) {
  const 消息 = document.getElementById('消息');
  try {
    if (!id) return;
    const d = await 投递台.getJSON('/api/事件/'+encodeURIComponent(id));
    document.getElementById('摘要态').textContent = 读态(d);
    document.getElementById('出').textContent = JSON.stringify(d, null, 2);
  } catch (e) { 消息.textContent = e.message; }
}
document.getElementById('查').onclick = () => 查询(document.getElementById('事件号').value);
(() => {
  const id = new URLSearchParams(location.search).get('事件号') || '';
  if (id) { document.getElementById('事件号').value = id; 查询(id); }
})();
</script>

</body>
</html>
